<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Pet World</title>
  <style>
    :root {
      --ink: #20243a;
      --cream: #fff9ed;
      --coral: #ff7a70;
      --sun: #ffd166;
      --mint: #70d6b1;
      --sky: #67c4f4;
      --violet: #8071d8;
      --paper: #ffffff;
      --line: #dfdfd4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background-color: var(--cream);
      background-image:
        radial-gradient(circle, rgba(32, 36, 58, 0.11) 1px, transparent 1.5px);
      background-size: 18px 18px;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 4px solid rgba(128, 113, 216, 0.38);
      outline-offset: 3px;
    }

    .site-header {
      position: relative;
      overflow: hidden;
      padding: 24px clamp(16px, 5vw, 64px);
      color: var(--ink);
      background: var(--coral);
      border-bottom: 4px solid var(--ink);
    }

    .site-header::after {
      content: "";
      position: absolute;
      right: 2%;
      top: -54px;
      width: 180px;
      height: 180px;
      border: 3px solid rgba(32, 36, 58, 0.17);
      border-radius: 50%;
      box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      font-size: 30px;
      transform: rotate(-6deg);
      box-shadow: 4px 4px 0 var(--ink);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 0.88;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .tagline {
      margin: 7px 0 0;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-button,
    .random-button,
    .filter-button,
    .favorite-button,
    .close-button {
      min-height: 44px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 800;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      box-shadow: 3px 3px 0 var(--ink);
    }

    .random-button {
      padding: 8px 14px;
      background: var(--sun);
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(1deg);
    }

    .random-button:hover { transform: rotate(-1deg) translateY(-2px); }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px clamp(16px, 5vw, 64px) 56px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter-button {
      min-width: 82px;
      padding: 8px 14px;
      border-width: 2px;
      border-radius: 999px;
      background: var(--paper);
    }

    .filter-button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
      box-shadow: 4px 4px 0 var(--sun);
      transform: translate(-2px, -2px);
    }

    .result-count {
      margin: 0;
      font-weight: 800;
      white-space: nowrap;
    }

    .pet-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px 22px;
    }

    .pet-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      border: 3px solid var(--ink);
      border-radius: 8px 8px 24px 8px;
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--ink);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .pet-card:nth-child(3n + 1) { transform: rotate(-0.45deg); }
    .pet-card:nth-child(3n + 2) { transform: rotate(0.35deg); }
    .pet-card:nth-child(3n) { border-radius: 24px 8px 8px 8px; }

    .pet-card:hover {
      transform: translate(-3px, -4px) rotate(0deg);
      box-shadow: 12px 12px 0 var(--ink);
    }

    .pet-card-button {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .visual {
      position: relative;
      height: 210px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 3px solid var(--ink);
      background: var(--card-color);
    }

    .visual::before,
    .visual::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(32, 36, 58, 0.12);
      background: rgba(255, 255, 255, 0.42);
    }

    .visual::before {
      width: 112px;
      height: 112px;
      left: -25px;
      top: -28px;
      border-width: 16px;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0 8px, transparent 8px 16px);
    }

    .visual::after {
      width: 58px;
      height: 58px;
      right: 18px;
      bottom: 12px;
      border-style: dashed;
      background: rgba(255,255,255,0.48);
    }

    .pet-face {
      position: relative;
      z-index: 1;
      width: 112px;
      height: 112px;
      border: 4px solid var(--ink);
      border-radius: 50%;
      background: var(--fur);
      box-shadow: inset 0 -14px 0 rgba(32, 36, 58, 0.08);
    }

    .pet-face.cat {
      border-radius: 46% 46% 50% 50%;
    }

    .ear {
      position: absolute;
      width: 38px;
      height: 44px;
      top: -23px;
      border: 4px solid var(--ink);
      background: var(--fur);
    }

    .ear.left { left: -5px; border-radius: 90% 10% 45% 45%; transform: rotate(-15deg); }
    .ear.right { right: -5px; border-radius: 10% 90% 45% 45%; transform: rotate(15deg); }

    .dog .ear {
      width: 32px;
      height: 60px;
      top: 18px;
      background: var(--accent);
    }

    .dog .ear.left { left: -25px; border-radius: 65% 30% 70% 45%; transform: rotate(12deg); }
    .dog .ear.right { right: -25px; border-radius: 30% 65% 45% 70%; transform: rotate(-12deg); }

    .eye {
      position: absolute;
      top: 42px;
      width: 13px;
      height: 16px;
      border-radius: 50%;
      background: var(--ink);
    }

    .eye.left { left: 28px; }
    .eye.right { right: 28px; }

    .eye::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: white;
    }

    .muzzle {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 48px;
      height: 35px;
      border-radius: 50%;
      background: var(--muzzle);
      transform: translateX(-50%);
    }

    .nose {
      position: absolute;
      left: 50%;
      top: 7px;
      width: 17px;
      height: 12px;
      border-radius: 50% 50% 60% 60%;
      background: var(--ink);
      transform: translateX(-50%);
    }

    .mouth {
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 18px;
      height: 9px;
      border-bottom: 3px solid var(--ink);
      border-radius: 0 0 50% 50%;
      transform: translateX(-50%);
    }

    .cat .muzzle { width: 42px; height: 28px; bottom: 19px; }
    .whiskers { position: absolute; inset: 0; }
    .whiskers::before,
    .whiskers::after {
      content: "";
      position: absolute;
      left: -19px;
      top: 74px;
      width: 27px;
      height: 2px;
      background: var(--ink);
      box-shadow: 0 8px 0 var(--ink);
      transform: rotate(-7deg);
    }
    .whiskers::after { left: auto; right: -19px; transform: rotate(7deg); }

    .card-info {
      position: relative;
      padding: 16px 18px 18px;
      border-top: 0;
      background: linear-gradient(135deg, var(--paper) 0 84%, var(--sun) 84% 100%);
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .pet-name {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.1;
    }

    .pet-type {
      margin: 7px 0 0;
      color: #5c6072;
      font-weight: 800;
    }

    .favorite-button {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 3;
      width: 44px;
      min-height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: var(--paper);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .favorite-button.active {
      background: var(--coral);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 44px 20px;
      border: 3px dashed var(--ink);
      border-radius: 8px;
      text-align: center;
      background: var(--paper);
    }

    dialog {
      width: min(680px, calc(100% - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 10px 10px 0 var(--ink);
    }

    dialog::backdrop {
      background: rgba(32, 36, 58, 0.72);
    }

    .dialog-grid {
      display: grid;
      grid-template-columns: 42% 58%;
      min-height: 390px;
    }

    .dialog-visual {
      position: relative;
      display: grid;
      place-items: center;
      border-right: 3px solid var(--ink);
      background: var(--card-color);
    }

    .dialog-visual .visual { height: 100%; border: 0; background: transparent; }

    .dialog-details {
      position: relative;
      padding: 34px 28px 28px;
    }

    .close-button {
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 5;
      width: 44px;
      padding: 0;
      font-size: 24px;
      line-height: 1;
    }

    .dialog-details h2 {
      margin: 0 52px 6px 0;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
    }

    .dialog-breed {
      margin: 0 0 22px;
      font-weight: 800;
      color: var(--violet);
    }

    .facts {
      margin: 0;
    }

    .fact {
      display: grid;
      grid-template-columns: 122px 1fr;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .fact dt { font-weight: 800; }
    .fact dd { margin: 0; }

    .dialog-favorite {
      width: 100%;
      margin-top: 22px;
      min-height: 46px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: var(--sun);
      color: var(--ink);
      font-weight: 800;
      box-shadow: 3px 3px 0 var(--ink);
    }

    @media (max-width: 820px) {
      .pet-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .header-inner { align-items: flex-start; }
      .tagline { max-width: 300px; }
    }

    @media (max-width: 620px) {
      .site-header { padding-block: 18px; }
      .header-inner { display: block; }
      .brand-mark { width: 50px; height: 50px; font-size: 26px; }
      .header-actions { margin-top: 16px; }
      .header-actions button { flex: 1; }
      main { padding-top: 24px; }
      .toolbar { align-items: flex-end; }
      .filters { max-width: 280px; }
      .filter-button { min-width: 70px; }
      .pet-grid { grid-template-columns: 1fr; gap: 18px; }
      .visual { height: 230px; }
      .dialog-grid { grid-template-columns: 1fr; }
      .dialog-visual { height: 220px; border-right: 0; border-bottom: 3px solid var(--ink); }
      .dialog-details { padding: 24px 20px 20px; }
      dialog { max-height: calc(100vh - 24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">🐾</div>
        <div>
          <h1>Hello Pet World</h1>
          <p class="tagline">Find a furry friend to make you smile.</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="favoritesFilter" type="button" aria-pressed="false">
          <span aria-hidden="true">♥</span>
          <span>Favorites <strong id="favoriteCount">0</strong></span>
        </button>
        <button class="random-button" id="randomButton" type="button">Surprise me</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="filters" aria-label="Filter pets">
        <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="dog" aria-pressed="false">Dogs</button>
        <button class="filter-button" type="button" data-filter="cat" aria-pressed="false">Cats</button>
      </div>
      <p class="result-count" id="resultCount" aria-live="polite"></p>
    </div>

    <section class="pet-grid" id="petGrid" aria-label="Available pets"></section>
  </main>

  <dialog id="petDialog" aria-labelledby="dialogName">
    <button class="close-button" id="closeDialog" type="button" aria-label="Close pet details">×</button>
    <div class="dialog-grid">
      <div class="dialog-visual" id="dialogVisual"></div>
      <div class="dialog-details">
        <h2 id="dialogName"></h2>
        <p class="dialog-breed" id="dialogBreed"></p>
        <dl class="facts" id="dialogFacts"></dl>
        <button class="dialog-favorite" id="dialogFavorite" type="button"></button>
      </div>
    </div>
  </dialog>

  <script>
    const pets = [
      {
        id: 1,
        name: "Biscuit",
        type: "dog",
        breed: "Golden Retriever Mix",
        age: "3 years",
        personality: "Friendly, cheerful, and a little goofy",
        activity: "Fetching tennis balls",
        cardColor: "#ffd166",
        fur: "#e9b86b",
        accent: "#bf7a43",
        muzzle: "#fff1cf"
      },
      {
        id: 2,
        name: "Poppy",
        type: "dog",
        breed: "Dalmatian",
        age: "2 years",
        personality: "Energetic, curious, and loyal",
        activity: "Going on neighborhood adventures",
        cardColor: "#70d6b1",
        fur: "#fffaf0",
        accent: "#4d4b58",
        muzzle: "#fffaf0"
      },
      {
        id: 3,
        name: "Maple",
        type: "dog",
        breed: "Corgi Mix",
        age: "5 years",
        personality: "Bright, playful, and affectionate",
        activity: "Learning new tricks",
        cardColor: "#ff9f7a",
        fur: "#e77e4d",
        accent: "#9f4c38",
        muzzle: "#fff0c2"
      },
      {
        id: 4,
        name: "Mochi",
        type: "cat",
        breed: "Ragdoll",
        age: "1 year",
        personality: "Gentle, calm, and cuddly",
        activity: "Napping in sunny spots",
        cardColor: "#67c4f4",
        fur: "#d9bfa4",
        accent: "#d9bfa4",
        muzzle: "#fff3dc"
      },
      {
        id: 5,
        name: "Pepper",
        type: "cat",
        breed: "Domestic Shorthair",
        age: "4 years",
        personality: "Brave, clever, and independent",
        activity: "Chasing feather toys",
        cardColor: "#b5a4e8",
        fur: "#777986",
        accent: "#777986",
        muzzle: "#b9b6b4"
      },
      {
        id: 6,
        name: "Sunny",
        type: "cat",
        breed: "Orange Tabby",
        age: "7 months",
        personality: "Silly, social, and full of energy",
        activity: "Climbing the tallest shelves",
        cardColor: "#f7a6b7",
        fur: "#efa35a",
        accent: "#efa35a",
        muzzle: "#ffe4b2"
      },
      {
        id: 7,
        name: "Luna",
        type: "cat",
        breed: "Tuxedo Cat",
        age: "2 years",
        personality: "Sweet, curious, and quietly confident",
        activity: "Watching birds from the window",
        cardColor: "#9ed7c5",
        fur: "#292c3a",
        accent: "#292c3a",
        muzzle: "#fffaf0"
      },
      {
        id: 8,
        name: "Noodle",
        type: "dog",
        breed: "Beagle Mix",
        age: "6 years",
        personality: "Mellow, funny, and snack motivated",
        activity: "Sniffing every interesting trail",
        cardColor: "#8ed3a7",
        fur: "#d99b5b",
        accent: "#6c4b3b",
        muzzle: "#f8dfb4"
      },
      {
        id: 9,
        name: "Cleo",
        type: "cat",
        breed: "Calico",
        age: "3 years",
        personality: "Expressive, graceful, and bold",
        activity: "Rearranging crinkly paper castles",
        cardColor: "#f1b7a6",
        fur: "#e9b96e",
        accent: "#6d5a52",
        muzzle: "#fff0d6"
      }
    ];

    const petGrid = document.getElementById("petGrid");
    const resultCount = document.getElementById("resultCount");
    const favoriteCount = document.getElementById("favoriteCount");
    const favoritesFilter = document.getElementById("favoritesFilter");
    const randomButton = document.getElementById("randomButton");
    const filterButtons = [...document.querySelectorAll(".filter-button")];
    const petDialog = document.getElementById("petDialog");
    const closeDialog = document.getElementById("closeDialog");
    const dialogVisual = document.getElementById("dialogVisual");
    const dialogName = document.getElementById("dialogName");
    const dialogBreed = document.getElementById("dialogBreed");
    const dialogFacts = document.getElementById("dialogFacts");
    const dialogFavorite = document.getElementById("dialogFavorite");

    let currentFilter = "all";
    let favoritesOnly = false;
    let openPetId = null;
    let favorites = new Set();

    try {
      const savedFavorites = JSON.parse(localStorage.getItem("helloPetWorldFavorites") || "[]");
      favorites = new Set(savedFavorites.filter(id => pets.some(pet => pet.id === id)));
    } catch (error) {
      favorites = new Set();
    }

    function saveFavorites() {
      localStorage.setItem("helloPetWorldFavorites", JSON.stringify([...favorites]));
    }

    function petVisual(pet, dialogSize = false) {
      const animalClass = pet.type === "cat" ? "cat" : "dog";
      return `
        <div class="visual${dialogSize ? " dialog-visual-inner" : ""}" style="--card-color:${pet.cardColor};--fur:${pet.fur};--accent:${pet.accent};--muzzle:${pet.muzzle}">
          <div class="pet-face ${animalClass}">
            <span class="ear left"></span>
            <span class="ear right"></span>
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="muzzle"><span class="nose"></span><span class="mouth"></span></span>
            ${pet.type === "cat" ? '<span class="whiskers"></span>' : ""}
          </div>
        </div>`;
    }

    function toggleFavorite(id, event) {
      if (event) event.stopPropagation();
      if (favorites.has(id)) {
        favorites.delete(id);
      } else {
        favorites.add(id);
      }
      saveFavorites();
      renderPets();
      if (openPetId === id) updateDialogFavorite(id);
    }

    function renderPets() {
      const visiblePets = pets.filter(pet => {
        const matchesType = currentFilter === "all" || pet.type === currentFilter;
        const matchesFavorites = !favoritesOnly || favorites.has(pet.id);
        return matchesType && matchesFavorites;
      });

      favoriteCount.textContent = favorites.size;
      favoritesFilter.setAttribute("aria-pressed", String(favoritesOnly));
      resultCount.textContent = `${visiblePets.length} ${visiblePets.length === 1 ? "pet" : "pets"}`;

      if (!visiblePets.length) {
        petGrid.innerHTML = `
          <div class="empty-state">
            <h2>No pets here yet</h2>
            <p>Try another filter or add a favorite from a pet card.</p>
          </div>`;
        return;
      }

      petGrid.innerHTML = visiblePets.map(pet => {
        const isFavorite = favorites.has(pet.id);
        return `
          <article class="pet-card">
            <button class="favorite-button ${isFavorite ? "active" : ""}" type="button" data-favorite-id="${pet.id}" aria-label="${isFavorite ? "Remove" : "Add"} ${pet.name} ${isFavorite ? "from" : "to"} favorites" aria-pressed="${isFavorite}">
              <span aria-hidden="true">${isFavorite ? "♥" : "♡"}</span>
            </button>
            <button class="pet-card-button" type="button" data-pet-id="${pet.id}" aria-label="View details for ${pet.name}">
              ${petVisual(pet)}
              <div class="card-info">
                <div class="name-row">
                  <div>
                    <h2 class="pet-name">${pet.name}</h2>
                    <p class="pet-type">${pet.type === "dog" ? "Dog" : "Cat"} · ${pet.breed}</p>
                  </div>
                </div>
              </div>
            </button>
          </article>`;
      }).join("");

      petGrid.querySelectorAll("[data-pet-id]").forEach(button => {
        button.addEventListener("click", () => openPet(Number(button.dataset.petId)));
      });

      petGrid.querySelectorAll("[data-favorite-id]").forEach(button => {
        button.addEventListener("click", event => toggleFavorite(Number(button.dataset.favoriteId), event));
      });
    }

    function updateDialogFavorite(id) {
      const pet = pets.find(item => item.id === id);
      const isFavorite = favorites.has(id);
      dialogFavorite.textContent = isFavorite ? `♥ Remove ${pet.name} from favorites` : `♡ Add ${pet.name} to favorites`;
      dialogFavorite.setAttribute("aria-pressed", String(isFavorite));
    }

    function openPet(id) {
      const pet = pets.find(item => item.id === id);
      if (!pet) return;
      openPetId = id;
      dialogName.textContent = pet.name;
      dialogBreed.textContent = `${pet.type === "dog" ? "Dog" : "Cat"} · ${pet.breed}`;
      dialogVisual.innerHTML = petVisual(pet, true);
      dialogFacts.innerHTML = `
        <div class="fact"><dt>Age</dt><dd>${pet.age}</dd></div>
        <div class="fact"><dt>Personality</dt><dd>${pet.personality}</dd></div>
        <div class="fact"><dt>Favorite activity</dt><dd>${pet.activity}</dd></div>`;
      updateDialogFavorite(id);
      petDialog.showModal();
    }

    function closePetDialog() {
      petDialog.close();
      openPetId = null;
    }

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        favoritesOnly = false;
        filterButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        renderPets();
      });
    });

    favoritesFilter.addEventListener("click", () => {
      favoritesOnly = !favoritesOnly;
      filterButtons.forEach(button => button.setAttribute("aria-pressed", "false"));
      renderPets();
    });

    randomButton.addEventListener("click", () => {
      const randomPet = pets[Math.floor(Math.random() * pets.length)];
      openPet(randomPet.id);
    });

    closeDialog.addEventListener("click", closePetDialog);

    petDialog.addEventListener("click", event => {
      const bounds = petDialog.getBoundingClientRect();
      const outside = event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom;
      if (outside) closePetDialog();
    });

    petDialog.addEventListener("close", () => {
      openPetId = null;
    });

    dialogFavorite.addEventListener("click", () => {
      if (openPetId !== null) toggleFavorite(openPetId);
    });

    renderPets();
  </script>
</body>
</html>
